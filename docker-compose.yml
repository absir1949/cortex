services:
  cortex:
    build: .
    container_name: cortex
    restart: unless-stopped
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./knowledge:/app/knowledge
      - ./research:/app/research
      - ./backup:/app/backup
      - ./state:/app/state                 # SQLite 数据库（避免和 app/db Python 包冲突）
      - ./creators.json:/app/creators.json:ro
